services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "81:3000"
    environment:
      - VITE_API_URL=http://localhost:3010
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - API_KEY=${API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ALERT_SEVERITY=${ALERT_SEVERITY:-high}
      - ALERT_CRON=${ALERT_CRON:-0 8 * * *}
    ports:
      - "3010:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
