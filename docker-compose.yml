services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "81:3000"
    environment:
      - VITE_API_URL=http://localhost:3010
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - TZ=Europe/Warsaw
      - API_KEY=${API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ALERT_SEVERITY=${ALERT_SEVERITY:-high}
      - ALERT_CRON=${ALERT_CRON:-0 8 * * *}
      - VALIDATE_SIGNALS=${VALIDATE_SIGNALS:-}
      - PORTFOLIO_SUMMARY=${PORTFOLIO_SUMMARY:-}
      - DCA_BUDGET_PLN=${DCA_BUDGET_PLN:-700}
      - SUMMARY_REUSE_MIN=${SUMMARY_REUSE_MIN:-300}
      - GEMINI_MAX_CALLS_PER_DAY=${GEMINI_MAX_CALLS_PER_DAY:-200}
      - GEMINI_MAX_SEARCH_CALLS_PER_DAY=${GEMINI_MAX_SEARCH_CALLS_PER_DAY:-25}
      - GEMINI_MAX_SEARCH_CALLS_PER_MONTH=${GEMINI_MAX_SEARCH_CALLS_PER_MONTH:-900}
      - GEMINI_MAX_COST_PLN_PER_MONTH=${GEMINI_MAX_COST_PLN_PER_MONTH:-5}
      # Raport obligacji po inflacji — zakupy z aplikacji portfel (sieć portfel_network)
      - BONDS_CRON=${BONDS_CRON:-0 18 * * 0}
      - PORTFEL_API_URL=${PORTFEL_API_URL:-http://portfel_api:8000/api}
      - PORTFEL_TOKEN=${PORTFEL_TOKEN:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - default
      - portfel_network

networks:
  portfel_network:
    external: true