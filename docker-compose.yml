services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "81:3000"
    environment:
      - VITE_API_URL=http://localhost:3010
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - TZ=Europe/Warsaw
      - API_KEY=${API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ALERT_SEVERITY=${ALERT_SEVERITY:-high}
      - ALERT_CRON=${ALERT_CRON:-0 8 * * *}
      - VALIDATE_SIGNALS=${VALIDATE_SIGNALS:-}
      - PORTFOLIO_SUMMARY=${PORTFOLIO_SUMMARY:-}
      - SUMMARY_REUSE_MIN=${SUMMARY_REUSE_MIN:-300}
    volumes:
      - ./backend:/app
      - /app/node_modules